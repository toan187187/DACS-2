; chọn env mặc định khi bấm nút Build
[platformio]
default_envs = v1_single

; cấu hình chung cho mọi env
[env]
platform = atmelavr
; Nano thì đổi thành: nanoatmega328new
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can
    marcoschwartz/LiquidCrystal_I2C

; ---- Version 1 ----
[env:v1_single]   
build_src_filter = -<*> +<V1_single/>
;upload_port = COM3

; ---- Version 2 (hai board cắm cùng lúc, hai cổng COM khác nhau) ----
[env:v2_ecu1]
build_src_filter = -<*> +<V2_ECU1/>
;upload_port = COM3
;monitor_port = COM3

[env:v2_ecu2]
build_src_filter = -<*> +<V2_ECU2/>
;upload_port = COM4
;monitor_port = COM4

; ---- Chương trình test từng khối (nằm trong src/) ----
[env:t_sensors]
build_src_filter = -<*> +<Test_sensors/>
;upload_port = COM3
;monitor_port = COM3

[env:t_actuators]
build_src_filter = -<*> +<Test_Actuators/>
;upload_port = COM3
;monitor_port = COM3

[env:t_displays]
build_src_filter = -<*> +<Test_Displays/>
;upload_port = COM3
;monitor_port = COM3

[env:t_can_MCP2515]
build_src_filter = -<*> +<Test_MCP2515/>
;upload_port = COM3
;monitor_port = COM3


[env:t_can_send]
build_src_filter = -<*> +<Test_send/>
;upload_port = Custom
;monitor_port = Custom 

[env:t_can_receive]
build_src_filter = -<*> +<Test_receive/>
; t_can_send (COM3) và t_can_recv (COM4) viết tương tự